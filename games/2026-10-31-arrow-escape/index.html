<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>やじるしエスケープ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header>
    <a class="back" href="../../">← 一覧</a>
    <div class="stat"><span>LEVEL</span><b id="level">1</b></div>
    <div class="stat"><span>SCORE</span><b id="score">0</b></div>
    <div class="stat"><span>BEST</span><b id="best">0</b></div>
  </header>
  <div id="sub">
    <div id="lives"></div>
    <div id="timebar"><i id="timefill"></i></div>
  </div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="toast"></div>
    <div id="overlay">
      <h1 id="ov-title">やじるしエスケープ</h1>
      <p id="ov-text">ブロックをタップすると、<br>やじるしの向きにまっすぐ飛んでいくよ。<br>ほかのブロックにぶつかるとハートが1つ減る。<br>じゃまにならない順番を見つけて、<br>盤面を空っぽにしよう！<br>早く片付けるほどボーナスが増える。</p>
      <p class="keys">PC: クリック、または 矢印キーで選んで Space / Enter</p>
      <button id="start">タップでスタート</button>
    </div>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
