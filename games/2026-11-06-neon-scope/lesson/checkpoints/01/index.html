<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ネオンスコープ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header>
    <a class="back" href="../../../../">← 一覧</a>
    <div class="stat"><span>LIFE</span><b id="life">♥♥♥</b></div>
    <div class="stat"><span>SCORE</span><b id="score">0</b></div>
    <div class="stat"><span>BEST</span><b id="best">0</b></div>
  </header>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="toast"></div>
    <div id="overlay">
      <h1 id="ov-title">ネオンスコープ</h1>
      <p id="ov-text">夜のビル街に<b class="red">赤いターゲット</b>が現れる。<br>画面を押しているあいだスコープでのぞき、<br>指を離した瞬間に撃つ！<br>頭に当てるとヘッドショットでボーナス。<br><b class="blue">青い市民</b>を撃ったり、ターゲットに<br>逃げられたりするとライフが減るよ。</p>
      <p class="keys">スマホ: 長押しでスコープ → ドラッグでねらう → 離して発射<br>PC: マウスを押してねらい、離して発射 / 矢印キーでねらい Space で発射</p>
      <button id="start">タップでスタート</button>
    </div>
  </div>
  <div id="hint">弾 <span id="ammo">●●●●●●</span></div>
</div>
<script src="game.js"></script>
</body>
</html>
