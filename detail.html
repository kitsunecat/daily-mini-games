<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ゲーム詳細 | Daily Mini Games</title>
  <link rel="stylesheet" href="assets/site.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="index.html"><span class="brand-mark">▶</span>Daily Mini Games</a>
      <nav><a href="https://github.com/kitsunecat/daily-mini-games">GitHub</a></nav>
    </div>
  </header>

  <main class="wrap" id="main">
    <div class="crumb"><a href="index.html">← ゲーム一覧</a></div>
    <div id="content"><p class="empty">読み込み中…</p></div>
  </main>

  <footer class="site-footer">
    <div class="wrap">各ゲームはオリジナルの名前・グラフィックで作られた非公式の簡易版です。参考作品の権利は各権利者に帰属します。</div>
  </footer>

  <script>
    (async () => {
      const REPO = 'https://github.com/kitsunecat/daily-mini-games';
      const content = document.getElementById('content');
      const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
      const id = new URLSearchParams(location.search).get('id');
      let game;
      try {
        const res = await fetch('games.json', { cache: 'no-cache' });
        const games = await res.json();
        game = games.find((g) => g.id === id);
      } catch (e) { /* 下でエラー表示 */ }
      if (!game) {
        content.innerHTML = '<p class="error">ゲームが見つかりませんでした。</p>';
        return;
      }
      document.title = `${game.title} | Daily Mini Games`;
      const base = `games/${encodeURIComponent(game.id)}/`;
      const ib = game.inspiredBy || {};
      content.innerHTML = `
        <section class="detail-head">
          <h1>${esc(game.title)}</h1>
          <div class="meta"><time datetime="${esc(game.date)}">${esc(game.date)}</time><span class="tag">${esc(game.genre)}</span></div>
        </section>
        <div class="detail-grid">
          <div class="shot"><img src="${esc(game.screenshot)}" alt="${esc(game.title)} のスクリーンショット"></div>
          <div class="info">
            <h3>あそびかた</h3><p>${esc(game.description)}</p>
            <h3>操作方法</h3><p>${esc(game.controls)}</p>
            <h3>参考にした作品</h3><p>${esc(ib.title)}（${esc(ib.store)} ${ib.rank ? esc(ib.rank) + '位' : ''}）</p>
            <a class="play-btn" href="${base}index.html">▶ プレイする</a>
          </div>
        </div>
        <section class="source">
          <div class="source-head">
            <h2>ソースコード</h2>
            <a href="${REPO}/tree/main/games/${encodeURIComponent(game.id)}" target="_blank" rel="noopener">GitHub でフォルダを見る ↗</a>
          </div>
          <div class="tabs" role="tablist"></div>
          <pre class="code"><code id="code">読み込み中…</code></pre>
        </section>`;

      const tabs = content.querySelector('.tabs');
      const codeEl = document.getElementById('code');
      const cache = {};
      const langOf = (f) => ({ js: 'javascript', html: 'xml', css: 'css', json: 'json' }[f.split('.').pop()] || 'plaintext');
      async function show(file) {
        for (const b of tabs.children) b.setAttribute('aria-selected', String(b.dataset.file === file));
        codeEl.className = '';
        codeEl.textContent = '読み込み中…';
        try {
          if (!(file in cache)) {
            const r = await fetch(base + file);
            if (!r.ok) throw new Error(r.status);
            cache[file] = await r.text();
          }
          const lang = langOf(file);
          if (window.hljs) {
            codeEl.innerHTML = hljs.highlight(cache[file], { language: lang }).value;
            codeEl.className = 'hljs language-' + lang;
          } else codeEl.textContent = cache[file];
        } catch (e) {
          codeEl.textContent = `${file} を読み込めませんでした。`;
        }
      }
      (game.files || []).forEach((f, i) => {
        const b = document.createElement('button');
        b.className = 'tab';
        b.setAttribute('role', 'tab');
        b.dataset.file = f;
        b.textContent = f;
        b.addEventListener('click', () => show(f));
        tabs.appendChild(b);
      });
      if (game.files && game.files.length) show(game.files[0]);
    })();
  </script>
</body>
</html>
