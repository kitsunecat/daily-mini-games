<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Mini Games</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #14172e;
    color: #eef0ff;
    font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif;
    line-height: 1.6;
  }
  main { max-width: 640px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 26px; }
  .lead { color: #9aa3c7; font-size: 14px; margin-bottom: 20px; }
  ul { list-style: none; display: flex; flex-direction: column; gap: 12px; }
  a.card {
    display: block;
    padding: 14px 16px;
    border-radius: 14px;
    background: #222852;
    color: inherit;
    text-decoration: none;
    border: 1px solid #333a70;
  }
  a.card:active, a.card:hover { background: #2b3266; }
  .date { font-size: 12px; color: #ffcf4a; }
  .title { font-size: 18px; font-weight: bold; }
  .desc { font-size: 13px; color: #b9c0e4; }
  .msg { color: #9aa3c7; }
</style>
</head>
<body>
<main>
  <h1>Daily Mini Games</h1>
  <p class="lead">毎日ひとつ増えるミニゲーム集。スマホでそのまま遊べます。</p>
  <ul id="list"><li class="msg">読み込み中…</li></ul>
</main>
<script>
  fetch('games.json', { cache: 'no-cache' })
    .then(r => r.json())
    .then(games => {
      const list = document.getElementById('list');
      list.innerHTML = '';
      games.sort((a, b) => b.date.localeCompare(a.date));
      for (const g of games) {
        const li = document.createElement('li');
        const a = document.createElement('a');
        a.className = 'card';
        a.href = 'games/' + encodeURIComponent(g.slug) + '/';
        for (const [cls, text] of [['date', g.date], ['title', g.title], ['desc', g.description]]) {
          const d = document.createElement('div');
          d.className = cls;
          d.textContent = text;
          a.appendChild(d);
        }
        li.appendChild(a);
        list.appendChild(li);
      }
      if (!games.length) list.innerHTML = '<li class="msg">まだゲームがありません。</li>';
    })
    .catch(() => {
      document.getElementById('list').innerHTML = '<li class="msg">一覧を読み込めませんでした。</li>';
    });
</script>
</body>
</html>
